# NovaOS Calamares Configuration
# Main installer configuration

[General]
backend = Calamares::JobQueue
job襄阳ps = 4
disable-cancel = false
show-cancel = true
show-jump-to-badness = false
skip-entry-jobs-if-resumed = false
oem-setup = false
dont-chroot = false
hostinfo = true
wait-cancel = false
disable-appstream = false

[Display]
quit-at-end = false
quit-on-cancel = true
quit-on-failed = false

# Window settings
window-width = 800
window-height = 600
window-maximum = false
window-size = fixed
window-title = "NovaOS Installer"
window-icon = novaos-icon

# Security
secure-install = true

# Modules to load (in order)
modules-dir = /etc/calamares/modules

# Branding
branding = novaos
