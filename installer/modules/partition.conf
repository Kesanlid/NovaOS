# NovaOS Partition Configuration

# Default filesystem type
defaultFileSystemType: btrfs

# Available filesystem types
availableFileSystemTypes:
  - btrfs
  - ext4
  - xfs
  - f2fs
  - swap

# Features
allowDualBoot: true
allowRemoveHomePartitions: false
requireSswap: false
initialSwap: none
neverDeleteSystemPartitions: false

# Partition schemes
# Default scheme: single Btrfs with subvolumes
defaultPartitionLayout:
  name: btrfs-single
  partitions:
    - mountPoint: /
      size: all
      filesystem: btrfs
      options:
        compress: zstd
        subvolumes:
          - /
          - /home
          - /var/log
          - /var/cache

# Boot loader
bootLoaderName: grub
bootLoaderEntryName: NovaOS
efiBootLoader: grub

# Advanced options
enableLuks: false
enableLvm: false
enableHomeLuks: false
requireHomeEncryption: false
showAvailableSwap: true
showRootPassword: true
