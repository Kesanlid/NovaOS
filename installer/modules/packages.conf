# NovaOS Package Manager Configuration

# Package manager to use
backend: pacman

# Update package lists before install
updateDb: true

# Installation command
installCommand:
  - pacman
  - --noconfirm
  - --needed
  - -Syu

# Packages to install
packages:
  # Base system
  - base
  - base-devel
  - linux
  - linux-firmware
  - linux-headers

  # Boot
  - grub
  - os-prober
  - efibootmgr

  # Desktop
  - plasma
  - sddm
  - sddm-kcm

  # Networking
  - networkmanager
  - iwd

  # Filesystem
  - btrfs-progs
  - dosfstools
  - ntfs-3g

  # Utilities
  - sudo
  - vim
  - man-pages
  - texinfo

  # Gaming essentials
  - gamemode
  - mangohud
  - lib32-mesa
  - vulkan-radeon
  - vulkan-intel

  # Fonts
  - noto-fonts
  - noto-fonts-cjk
  - noto-fonts-emoji

# AUR helper (optional)
# aurchelper: yay
