# NovaOS Sound Configuration
# Sound event configuration for boot, shutdown, and login

# This file configures system sounds for NovaOS
# Copy to /etc/sound/ or use with Plasma system settings

[Boot]
Enabled=true
Volume=80
SoundFile=/usr/share/sounds/nova/boot.wav

[Shutdown]
Enabled=true
Volume=80
SoundFile=/usr/share/sounds/nova/shutdown.wav

[Login]
Enabled=true
Volume=70
SoundFile=/usr/share/sounds/nova/login.wav

[Logout]
Enabled=false
Volume=70
SoundFile=/usr/share/sounds/nova/logout.wav

[Screenshot]
Enabled=false
Volume=50
SoundFile=/usr/share/sounds/nova/screenshot.wav
