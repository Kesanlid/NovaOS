# NovaOS SDDM Theme Configuration

[General]
background="/usr/share/sddm/nova/background.png"
logo="/usr/share/sddm/nova/logo.png"

[RelayService]
Type=QML
main="Main.qml"

[Design]
HoursColor="#e94560"
MinutesColor="#e94560"
CursorColor="#e94560"
BackgroundColor="#0a0a14"
CredentialBackgroundColor="#1a1a2e"
CredentialBackgroundOpacity=0.7
FontFamily="Noto Sans"
FontSize=14

# Button colors
[Button]
backgroundColor="#e94560"
backgroundColorOpacity=0.8
foregroundColor="#ffffff"
borderColor="#ff6b8a"

[ButtonHoveR]
backgroundColor="#ff6b8a"

[ButtonPressed]
backgroundColor="#c73e54"

[InputField]
backgroundColor="#0a0a14"
borderColor="#0f3460"
borderColorOpacity=0.8
foregroundColor="#ffffff"
selectionColor="#e94560"

[InputFieldFocus]
borderColor="#e94560"

# Session screen colors
[Session]
FormBackgroundColor="#1a1a2e"
FormBackgroundOpacity=0.9
UsernameColor="#ffffff"
UsernameFontSize=16
UsernameFontWeight=500
SessionFontSize=14

# User list
[UserList]
ItemBackgroundColor="#0a0a14"
ItemBackgroundOpacity=0.8
ItemForegroundColor="#aaaaaa"
ItemCurrentBackgroundColor="#e94560"
ItemCurrentBackgroundOpacity=0.9
ItemCurrentForegroundColor="#ffffff"
ItemFontSize=14
ItemHeight=48
ItemSpacing=8

# Clock
[Clock]
FontFamily="Noto Sans"
FontSize=48
FontWeight=Light
ForegroundColor="#ffffff"
DateFontSize=14
DateForegroundColor="#aaaaaa"

# Action bar
[ActionBar]
ActionButtonBackgroundColor="#1a1a2e"
ActionButtonBackgroundOpacity=0.8
ActionButtonForegroundColor="#aaaaaa"
ActionButtonCurrentBackgroundColor="#e94560"
ActionButtonCurrentForegroundColor="#ffffff"
