# GRUB Configuration for NovaOS
# This file is used as a template and copied during ISO build

# Set default menu entry
set default="0"
set timeout="5"

# Boot partitioning
set grub_root="hd0,gpt2"

# Gaming optimizations
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 nowatchdog nmi_watchdog=0"

# Theme
GRUB_THEME="/boot/grub/themes/nova/theme.txt"
GRUB_BACKGROUND="/boot/grub/themes/nova/background.png"

# Terminal output
GRUB_TERMINAL_OUTPUT="gfxterm"

# gfxmode (set to match display)
GRUB_GFXMODE="1920x1080"
GRUB_GFXPAYLOAD_LINUX="keep"

# Serial console (optional)
# GRUB_TERMINAL="console serial"
# GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200"

# Memory mapping
GRUB_DISABLE_LINUX_RECOVERY="false"
GRUB_DISABLE_OS_PROBER="false"

# Advanced options
GRUB_CMDLINE_LINUX=""

# Theme colors
export GRUB_COLOR_NORMAL="light-gray/black"
export GRUB_COLOR_HIGHLIGHT="white/cyan"
export GRUB_COLOR_MENU="light-gray/black"
export GRUB_COLOR_HELP="white/black"

# Background
export GRUB_BACKGROUND="/boot/grub/themes/nova/background.png"

# Terminal font
export GRUB_FONT="/boot/grub/fonts/unicode.pf2"

# Import theme
source /boot/grub/themes/nova/theme.txt
