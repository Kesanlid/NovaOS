# /etc/rc.conf - Global Configuration Settings
# This file is sourced by /etc/rc at boot

# Locale settings
LOCALE=en_US.UTF-8
LC_ALL=C

# Keyboard layout
KEYMAP=us
FONT=lat9w-16
FONT_MAP=

# Timezone
TIMEZONE=UTC
HARDWARECLOCK=utc

# Network configuration
NETWORK_PERSIST="no"

# Daemons to start at boot
DAEMONS=(systemd-networkd systemd-resolved iwd haveged dbus polkit sddm)
