#
# /etc/pacman.conf
# NovaOS pacman configuration
#

[options]
# Architecture
Architecture = auto

# Pacman package cache
CacheDir = /var/cache/pacman/pkg

# Packager
Packager = NovaOS Team <packager@novaos.org>

# GPG check
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Parallel downloads
ParallelDownloads = 5

# Color output
Color

# Verbose package lists
VerbosePkgLists

# ILoveCandy (progress bar style)
ILoveCandy

# Check space before download
CheckSpace

# Upgrade threshold
UpgradeThreshold = 0.0

# Auto-refresh
Refresh = yes

# Include multilib
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

# Multilib for 32-bit support (Steam)
[multilib]
Include = /etc/pacman.d/mirrorlist

# AUR support
[chaotic-aur]
Server = https://cdn-mirrors.chaotic.cx/$repo/$arch
SigLevel = Required

# Gaming repositories
[games]
Include = /etc/pacman.d/mirrorlist
