# mkinitcpio configuration for NovaOS
# Optimized for gaming with fast boot and Plymouth support

MODULES=(btrfs amdgpu radeon i915 nvidia nvidia_modeset nvidia_uvm nvidia_drm)
BINARIES=(/usr/bin/btrfs)
FILES=()

# Optimized hooks for gaming system
HOOKS=(base udev plymouth autodetect modconf block filesystems keyboard fsck)

# Compression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0)

# Additional options
BUILDIMAGE="/etc/mkinitcpio.d"
