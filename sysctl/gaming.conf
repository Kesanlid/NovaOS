# NovaOS Gaming Performance Configuration
# Applied via sysctl -p /etc/sysctl.d/gaming.conf

# ====================
# Memory & Performance
# ====================

# Better memory management
vm.swappiness = 10
vm.dirty_ratio = 60
vm.dirty_background_ratio = 3
vm.vfs_cache_pressure = 50

# Transparent HugePages for gaming
vm.nr_hugepages = 0

# ====================
# Scheduler Tuning
# ====================

# Improve desktop responsiveness
kernel.sched_autogroup_enabled = 0
kernel.sched_migration_cost_ns = 5000000

# ====================
# Network Optimization
# ====================

# Network throughput
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# TCP congestion
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# ====================
# Gaming-Specific
# ====================

# Disable watchdogs for latency
kernel.nmi_watchdog = 0

# Improve real-time performance
kernel.sched_rt_runtime_us = -1

# USB polling interval (for input devices)
usb.ls_udev_delay = 0
