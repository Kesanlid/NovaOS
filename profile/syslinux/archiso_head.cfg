SERIAL 0 115200
CONSOLE 0
DEFAULT select
TIMEOUT 50

LABEL select
MENU LABEL NovaOS Boot Menu
KERNEL menu.c32
APPEND boot.syslinux/

LABEL nova
MENU LABEL Boot NovaOS
KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND boot=%INSTALL_DIR% archisobasedir=%INSTALL_DIR% archisodevice=archisolabel=%ISO_LABEL%

LABEL nova-fallback
MENU LABEL Boot NovaOS (fallback)
KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-fallback.img
APPEND boot=%INSTALL_DIR% archisobasedir=%INSTALL_DIR% archisodevice=archisolabel=%ISO_LABEL%

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
