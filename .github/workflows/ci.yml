name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          pacman -Sy --noconfirm shellcheck
          find . -name "*.sh" -exec shellcheck {} \;

  validate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Build System
        run: |
          # Check build script syntax
          bash -n ./build-system/build.sh
          
          # Check package lists
          for f in packages/*/*.txt; do
            echo "Checking $f..."
          done
