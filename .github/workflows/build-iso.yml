name: Build NovaOS ISO

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Arch container
        run: |
          echo "=== Starting Docker ==="
          docker version
          docker run -d --name archbuild --privileged archlinux:latest sleep infinity
          docker ps -a
          docker exec archbuild cat /etc/os-release

      - name: Build ISO
        timeout-minutes: 60
        run: |
          echo "=== Copying files ==="
          docker cp . archbuild:/root/novaos || exit 1
          
          echo "=== Installing packages ==="
          docker exec archbuild bash -c "
            set -e
            pacman-key --init || true
            pacman-key --populate archlinux || true
            # Clean and update pacman databases
            rm -rf /var/lib/pacman/sync/*
            pacman -Sy --noconfirm || true
            pacman -Sy --noconfirm archiso git
          " || exit 1
          
          echo "=== Building ISO ==="
          docker exec archbuild bash -c "
            set -e
            # Clean previous builds
            rm -rf /root/novaos/build-system/work /root/novaos/build-system/out
            mkdir -p /root/novaos/build-system/work /root/novaos/build-system/out
            
            cd /root/novaos
            chmod +x build-system/build.sh
            ./build-system/build.sh --profile nova
          " || exit 1

      - name: Check output
        run: |
          echo "=== Checking for ISO ==="
          docker exec archbuild ls -la /root/novaos/build-system/out/ 2>/dev/null || echo "No output dir"
          mkdir -p output
          docker cp archbuild:/root/novaos/build-system/out/. output/ 2>/dev/null || { echo "FAILED: No ISO found"; exit 1; }
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: output/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker stop archbuild 2>/dev/null || true
          docker rm archbuild 2>/dev/null || true
