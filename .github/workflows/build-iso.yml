name: Build NovaOS ISO

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'nova'
      mirror:
        description: 'Package mirror URL'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archiso mkinitcpio-archiso

      - name: Build ISO
        run: |
          ./build-system/build.sh --profile ${{ github.event.inputs.profile || 'nova' }} --mirror '${{ github.event.inputs.mirror || '' }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: build-system/out/*.iso
          retention-days: 7

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-SHA256
          path: build-system/out/*.sha256
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NovaOS-ISO

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.iso"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
