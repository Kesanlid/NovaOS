name: Build NovaOS ISO

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO
        timeout-minutes: 90
        run: |
          mkdir -p /tmp/nova-build/{cache,pacman-db,work,out}
          docker stop archiso-build 2>/dev/null || true
          docker rm archiso-build 2>/dev/null || true
          
          docker run -d \
            --name archiso-build \
            --privileged \
            -v /tmp/nova-build/cache:/var/cache/pacman \
            -v /tmp/nova-build/pacman-db:/var/lib/pacman \
            archlinux:latest \
            sleep infinity
          
          sleep 3
          
          docker exec archiso-build bash -c '
            set -e
            rm -rf /var/lib/pacman/*
            rm -rf /var/cache/pacman/*
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm
            pacman -S --noconfirm archiso git
          '
          
          docker cp . archiso-build:/build
          
          docker exec archiso-build bash -c '
            rm -rf /build/build-system/profiles/nova/airootfs/var/lib/pacman
            rm -rf /build/build-system/profiles/nova/airootfs/var/cache
            mkdir -p /build/build-system/profiles/nova/airootfs/var/lib
          '
          
          docker exec archiso-build bash -c '
            set -e
            cd /build
            chmod +x build-system/build.sh
            ./build-system/build.sh
          ' || { docker logs archiso-build; exit 1; }

      - name: Copy artifacts
        run: |
          mkdir -p output
          docker cp archiso-build:/build/build-system/out/. output/ 2>/dev/null || { echo "FAILED"; docker logs archiso-build; exit 1; }
          ls -lh output/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: output/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker stop archiso-build 2>/dev/null || true
          docker rm archiso-build 2>/dev/null || true
