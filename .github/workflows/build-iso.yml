name: Build NovaOS ISO

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      archlinux:
        image: archlinux:latest
        options: --privileged
        volumes:
          - ${{ github.workspace }}:/workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: /workspace/NovaOS

      - name: Build ISO in Arch container
        run: |
          # Update and install archiso
          pacman -Sy --noconfirm archiso
          
          # Build ISO
          cd /workspace/NovaOS
          chmod +x build-system/build.sh
          ./build-system/build.sh --profile nova --clean 2>&1 | tee /tmp/build.log
          
          echo "Exit code: $?"

      - name: Copy artifacts
        run: |
          mkdir -p output
          cp /workspace/NovaOS/build-system/out/*.iso output/ 2>/dev/null || echo "No ISO"
          cp /workspace/NovaOS/build-system/out/*.sha256 output/ 2>/dev/null || true
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: output/
          retention-days: 14
          if-no-files-found: warn
