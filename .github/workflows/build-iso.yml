name: Build NovaOS ISO

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Arch container
        run: |
          docker run -d --name archbuild --privileged archlinux:latest sleep infinity
          docker exec archbuild mkdir -p /root/novaos
          docker ps

      - name: Build ISO
        run: |
          # Copy files to container
          docker cp . archbuild:/root/novaos
          
          # Install archiso and build
          docker exec archbuild bash -c "
            # Update pacman database first
            pacman -Sy --noconfirm 2>&1 | tail -3 || true
            pacman -Sy --noconfirm archiso git 2>&1 | tail -5
            
            # Configure pacman to use working mirror
            cat > /etc/pacman.conf << 'PACMAN'
[options]
Architecture = auto
SigLevel    = Never
LocalFileSigLevel = Never

[core]
Server = https://mirror.rackspace.com/archlinux/\$repo/os/\$arch

[extra]
Server = https://mirror.rackspace.com/archlinux/\$repo/os/\$arch

[community]
Server = https://mirror.rackspace.com/archlinux/\$repo/os/\$arch
PACMAN
            
            # Rebuild database
            pacman -Sy 2>&1 | tail -5 || true
            
            cd /root/novaos
            chmod +x build-system/build.sh
            ./build-system/build.sh --profile nova --clean 2>&1
          "

      - name: Copy artifacts
        run: |
          mkdir -p output
          docker cp archbuild:/root/novaos/build-system/out/. output/ 2>/dev/null || echo "No ISO"
          ls -la output/

      - name: Cleanup
        if: always()
        run: |
          docker stop archbuild 2>/dev/null || true
          docker rm archbuild 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-ISO
          path: output/
          retention-days: 14
          if-no-files-found: warn
